<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contrôle des données — Agenda du jour</title>
<style>
:root{color-scheme:light;--bg:#f3f5f7;--card:#fff;--text:#1f2937;--muted:#667085;--ok:#157347;--ok-bg:#e9f7ef;--bad:#b42318;--bad-bg:#ffe8e6;--neutral:#475467;--neutral-bg:#f2f4f7;--border:#d0d5dd;--accent:#1f5fae}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.page{width:min(1120px,100%);margin:0 auto;padding:18px}h1{margin:0 0 6px;font-size:clamp(1.65rem,5vw,2.35rem)}.intro{margin:0 0 18px;color:var(--muted);line-height:1.45}.controle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 3px 14px rgba(0,0,0,.05)}label{display:flex;flex-direction:column;gap:6px;font-weight:700}input,button{min-height:46px;font:inherit;border-radius:10px}input{width:100%;padding:9px 11px;border:1px solid var(--border);background:#fff}button{border:0;padding:10px 16px;font-weight:800;cursor:pointer}#btn-controler{align-self:end;background:var(--accent);color:#fff}#btn-aujourdhui{margin-top:10px;background:#e9eef7;color:#153d70}.etat-chargement{margin:16px 0;padding:13px 15px;border-radius:12px;background:#fff;border:1px solid var(--border);font-weight:700}.resume{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.resume>div{padding:14px;text-align:center;border-radius:13px;font-weight:850;background:#fff;border:1px solid var(--border)}.resume .ok{color:var(--ok);background:var(--ok-bg)}.resume .bad{color:var(--bad);background:var(--bad-bg)}.live{margin:18px 0;background:#222;color:#fff;border-radius:15px;overflow:hidden}.live h2{margin:0;padding:12px 15px;background:#b42318;font-size:1.08rem}.live-contenu{padding:12px 15px}.live-item{padding:6px 0;line-height:1.4}.live-vide{color:#d0d5dd;font-weight:700}.jour{margin:16px 0;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.045)}.jour-entete{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;background:#eef2f6;border-bottom:1px solid var(--border)}.jour-date{font-size:1.08rem;font-weight:900;text-transform:capitalize}.jour-statut{font-weight:900;white-space:nowrap}.jour-statut.ok{color:var(--ok)}.jour-statut.bad{color:var(--bad)}.ligne{margin:10px 12px;padding:11px 12px;border-radius:12px;border:2px solid transparent}.ligne.ok{background:var(--ok-bg);border-color:#9bd6b3}.ligne.bad{background:var(--bad-bg);border-color:#e5484d;animation:alerte-pulse 1.5s ease-in-out infinite}.ligne.neutral{background:var(--neutral-bg);border-color:#d0d5dd}@keyframes alerte-pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,35,24,0)}50%{box-shadow:0 0 0 5px rgba(180,35,24,.13)}}.ligne-titre{font-weight:900;margin-bottom:6px}.ligne.bad .ligne-titre,.ligne.bad .manquant{color:var(--bad);font-weight:950}.details{line-height:1.42;overflow-wrap:anywhere}.detail-item+.detail-item{margin-top:5px}.erreur-fichier{color:var(--bad);font-weight:900}@media(max-width:720px){.page{padding:12px}.controle{grid-template-columns:1fr}.resume{grid-template-columns:1fr}.jour-entete{align-items:flex-start;flex-direction:column}.jour-statut{white-space:normal}.ligne{margin:8px}}@media(prefers-reduced-motion:reduce){.ligne.bad{animation:none}}
</style>
</head>
<body>
<main class="page">
<h1>🔎 Contrôle des données</h1>
<p class="intro">Contrôle en lecture seule des données de l’Agenda. Les rubriques quotidiennes absentes sont signalées en rouge. Les événements prévus et live sont informatifs : leur absence n’est pas considérée comme une erreur.</p>
<section class="controle">
<label>Date de départ<input id="date-depart" type="date"></label>
<label>Nombre de jours<input id="nb-jours" type="number" min="1" max="366" value="7" inputmode="numeric"></label>
<button id="btn-controler" type="button">🔎 CONTRÔLER</button>
</section>
<button id="btn-aujourdhui" type="button">Aujourd’hui + 7 jours</button>
<div id="etat" class="etat-chargement">Chargement des fichiers…</div>
<section id="resume" class="resume" hidden></section>
<section id="live" class="live" hidden></section>
<section id="resultats"></section>
</main>
<script>
"use strict";
const DATA_URL="https://raw.githubusercontent.com/Alain31140/Agenda-data/main/json/";
const FICHIERS={saints:"saints.json",dictons:"dictons-du-jour.json",journees:"journees-mondiales.json",celebrations:"celebrations-mensuelles.json",culture:"culture.json",personnalites:"personnalites.json",evenements:"evenements.json",prevus:"evenements-prevus.json",live:"evenements-live.json"};
const data={},erreurs={};
const QUOTIDIENS=[{cle:"saints",label:"Saint",icone:"🙏"},{cle:"dictons",label:"Dicton",icone:"💬"},{cle:"journees",label:"Journée mondiale",icone:"🌍"},{cle:"culture",label:"Culture",icone:"🎭"},{cle:"personnalites",label:"Personnalités",icone:"👤"},{cle:"evenements",label:"Événements du jour",icone:"📜"}];
function pad2(n){return String(n).padStart(2,"0")}
function dateLocaleISO(d){return [d.getFullYear(),pad2(d.getMonth()+1),pad2(d.getDate())].join("-")}
function cleJour(d){return `${pad2(d.getDate())}-${pad2(d.getMonth()+1)}`}
function cleMois(d){return pad2(d.getMonth()+1)}
function ajouterJours(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function dateDepuisInput(v){const[a,m,j]=v.split("-").map(Number);return new Date(a,m-1,j)}
function echapperHTML(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
async function chargerJSON(cle,fichier){try{const r=await fetch(DATA_URL+fichier+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);data[cle]=await r.json()}catch(e){erreurs[cle]=e.message;data[cle]=(cle==="prevus"||cle==="live")?[]:{}}}
async function chargerTout(){const etat=document.getElementById("etat");etat.textContent="Chargement des fichiers Agenda-data…";await Promise.all(Object.entries(FICHIERS).map(([c,f])=>chargerJSON(c,f)));const n=Object.keys(erreurs).length;if(!n){etat.innerHTML="✅ Tous les fichiers JSON ont été chargés."}else{etat.innerHTML=`❌ ${n} fichier(s) impossible(s) à charger : `+Object.entries(erreurs).map(([c,m])=>`${FICHIERS[c]} (${m})`).join(" — ");etat.classList.add("erreur-fichier")}}
function valeurDuJour(source,date){if(source==null)return null;const cle=cleJour(date);if(typeof source==="object"&&!Array.isArray(source)&&Object.prototype.hasOwnProperty.call(source,cle))return source[cle];return null}
function valeurDuMois(source,date){if(source==null)return null;const m=cleMois(date),m2=String(date.getMonth()+1);if(typeof source==="object"&&!Array.isArray(source)){if(Object.prototype.hasOwnProperty.call(source,m))return source[m];if(Object.prototype.hasOwnProperty.call(source,m2))return source[m2]}return null}
function estVide(v){if(v==null)return true;if(typeof v==="string")return v.trim()==="";if(Array.isArray(v))return v.length===0;if(typeof v==="object")return Object.keys(v).length===0;return false}
function normaliserItems(v){if(v==null)return[];if(typeof v==="string"||typeof v==="number")return String(v).trim()?[v]:[];if(Array.isArray(v))return v.filter(x=>!estVide(x));if(typeof v==="object"){if(Array.isArray(v.items))return v.items.filter(x=>!estVide(x));if(Object.prototype.hasOwnProperty.call(v,"items"))return normaliserItems(v.items);return estVide(v)?[]:[v]}return[]}
function texteObjet(obj){if(obj==null)return"";if(typeof obj!=="object")return echapperHTML(obj);const champs=["texte","titre","nom","saint","dicton","journee","journée","label","libelle","libellé","description","evenement","événement"];const morceaux=[];for(const c of champs){if(obj[c]!=null&&String(obj[c]).trim())morceaux.push(echapperHTML(obj[c]))}if(obj.type)morceaux.unshift(`<strong>${echapperHTML(obj.type)}</strong>`);if(obj.annee||obj["année"])morceaux.push(`(${echapperHTML(obj.annee??obj["année"])})`);if(morceaux.length)return morceaux.join(" — ");const simples=Object.entries(obj).filter(([k,v])=>!["image","imageUrl","url","source","id","items"].includes(k)&&(typeof v==="string"||typeof v==="number")).slice(0,5).map(([k,v])=>`<strong>${echapperHTML(k)}</strong> : ${echapperHTML(v)}`);return simples.length?simples.join(" — "):"Objet présent"}
function renduItems(items){return items.map(x=>`<div class="detail-item">• ${texteObjet(x)}</div>`).join("")}
function ligneQuotidienne(c,date){if(erreurs[c.cle])return `<div class="ligne bad"><div class="ligne-titre">❌ ${c.icone} ${c.label}</div><div class="manquant">FICHIER NON CHARGÉ : ${echapperHTML(FICHIERS[c.cle])}</div></div>`;const items=normaliserItems(valeurDuJour(data[c.cle],date));if(!items.length)return `<div class="ligne bad"><div class="ligne-titre">❌ ${c.icone} ${c.label}</div><div class="manquant">🚨 DONNÉE MANQUANTE</div></div>`;return `<div class="ligne ok"><div class="ligne-titre">✅ ${c.icone} ${c.label}</div><div class="details">${renduItems(items)}</div></div>`}
function ligneCelebration(date){if(erreurs.celebrations)return `<div class="ligne bad"><div class="ligne-titre">❌ 📅 Célébration du mois</div><div class="manquant">FICHIER NON CHARGÉ : celebrations-mensuelles.json</div></div>`;const items=normaliserItems(valeurDuMois(data.celebrations,date));if(!items.length)return `<div class="ligne bad"><div class="ligne-titre">❌ 📅 Célébration du mois</div><div class="manquant">🚨 DONNÉE MANQUANTE</div></div>`;return `<div class="ligne ok"><div class="ligne-titre">✅ 📅 Célébration du mois</div><div class="details">${renduItems(items)}</div></div>`}
function evenementsPrevusPourDate(date){if(!Array.isArray(data.prevus))return[];const iso=dateLocaleISO(date);return data.prevus.filter(ev=>{if(!ev||typeof ev!=="object")return false;const debut=ev.afficherDu||ev.date||ev.debut||ev.start,fin=ev.afficherJusquAu||ev.date||ev.fin||ev.end||debut;return debut&&fin&&iso>=String(debut).slice(0,10)&&iso<=String(fin).slice(0,10)})}
function lignePrevus(date){if(erreurs.prevus)return `<div class="ligne bad"><div class="ligne-titre">❌ 📌 Événements prévus</div><div class="manquant">FICHIER NON CHARGÉ : evenements-prevus.json</div></div>`;const items=evenementsPrevusPourDate(date);if(!items.length)return `<div class="ligne neutral"><div class="ligne-titre">✅ 📌 Événements prévus</div><div class="details">Aucun événement prévu actif pour cette date — c’est normal.</div></div>`;return `<div class="ligne ok"><div class="ligne-titre">✅ 📌 Événements prévus</div><div class="details">${renduItems(items)}</div></div>`}
function rubriqueEstValide(cle,date){return !erreurs[cle]&&normaliserItems(valeurDuJour(data[cle],date)).length>0}
function celebrationValide(date){return !erreurs.celebrations&&normaliserItems(valeurDuMois(data.celebrations,date)).length>0}
function controleJour(date){const vals=[...QUOTIDIENS.map(q=>rubriqueEstValide(q.cle,date)),celebrationValide(date)],manquants=vals.filter(v=>!v).length,complet=manquants===0,dateLongue=new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(date),corps=[ligneQuotidienne(QUOTIDIENS[0],date),ligneQuotidienne(QUOTIDIENS[1],date),ligneQuotidienne(QUOTIDIENS[2],date),ligneCelebration(date),ligneQuotidienne(QUOTIDIENS[3],date),ligneQuotidienne(QUOTIDIENS[4],date),ligneQuotidienne(QUOTIDIENS[5],date),lignePrevus(date)].join("");return{complet,manquants,html:`<article class="jour"><div class="jour-entete"><div class="jour-date">${echapperHTML(dateLongue)}</div><div class="jour-statut ${complet?"ok":"bad"}">${complet?"✅ JOURNÉE COMPLÈTE":`❌ JOURNÉE INCOMPLÈTE — ${manquants} donnée(s) manquante(s)`}</div></div>${corps}</article>`}}
function afficherLive(){const bloc=document.getElementById("live");bloc.hidden=false;if(erreurs.live){bloc.innerHTML=`<h2>🔴 ÉVÉNEMENTS LIVE ACTUELS</h2><div class="live-contenu">❌ Impossible de charger evenements-live.json</div>`;return}const live=Array.isArray(data.live)?data.live:[];bloc.innerHTML=`<h2>🔴 ÉVÉNEMENTS LIVE ACTUELS</h2><div class="live-contenu">${live.length?live.map(ev=>`<div class="live-item">${echapperHTML(ev.icone||"📢")} ${echapperHTML(ev.texte||"")}</div>`).join(""):`<div class="live-vide">✅ Aucun événement live actuellement — ce n’est pas une anomalie.</div>`}</div>`}
function controler(){const id=document.getElementById("date-depart"),inb=document.getElementById("nb-jours");if(!id.value)id.value=dateLocaleISO(new Date());const depart=dateDepuisInput(id.value);let nb=Number(inb.value);if(!Number.isFinite(nb)||nb<1)nb=1;if(nb>366)nb=366;inb.value=nb;let complets=0,incomplets=0,total=0;const html=[];for(let i=0;i<nb;i++){const r=controleJour(ajouterJours(depart,i));html.push(r.html);if(r.complet)complets++;else incomplets++;total+=r.manquants}document.getElementById("resultats").innerHTML=html.join("");const resume=document.getElementById("resume");resume.hidden=false;resume.innerHTML=`<div class="ok">✅ ${complets} jour(s) complet(s)</div><div class="${incomplets?"bad":"ok"}">${incomplets?"❌":"✅"} ${incomplets} jour(s) avec anomalie</div><div class="${total?"bad":"ok"}">${total?"🚨":"✅"} ${total} donnée(s) manquante(s)</div>`;afficherLive()}
function reglerAujourdHui(){document.getElementById("date-depart").value=dateLocaleISO(new Date());document.getElementById("nb-jours").value=7}
document.getElementById("btn-controler").addEventListener("click",controler);document.getElementById("btn-aujourdhui").addEventListener("click",()=>{reglerAujourdHui();controler()});(async function(){reglerAujourdHui();await chargerTout();controler()})();
</script>
</body>
</html>
